<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3A94"/>
      <stop offset="1" stop-color="#161F5C"/>
    </linearGradient>
    <pattern id="rules" width="1280" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="39.5" x2="1280" y2="39.5" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background: register ink with faint ledger lines -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#rules)"/>
  <line x1="96" y1="0" x2="96" y2="640" stroke="#FFB3AA" stroke-opacity="0.18" stroke-width="2"/>

  <!-- left: title -->
  <g transform="translate(140 0)">
    <text x="0" y="210" fill="#FFFFFF" font-size="92" font-weight="800" letter-spacing="-2">KhataBol</text>
    <text x="4" y="268" fill="#8BE7C1" font-size="38" font-weight="600">Speak your khata.</text>
    <text x="4" y="330" fill="#FFFFFF" fill-opacity="0.82" font-size="24">
      <tspan x="4" dy="0">Bookkeeping for small traders, on WhatsApp.</tspan>
      <tspan x="4" dy="36">Text, Urdu voice note or a photo of a parchi.</tspan>
      <tspan x="4" dy="36">Read back, confirmed with "Haan", then saved.</tspan>
    </text>

    <!-- tags -->
    <g font-size="18" font-weight="600" fill="#FFFFFF">
      <rect x="4" y="452" width="102" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="55" y="477" text-anchor="middle">Flutter</text>
      <rect x="118" y="452" width="118" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="177" y="477" text-anchor="middle">Supabase</text>
      <rect x="248" y="452" width="136" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="316" y="477" text-anchor="middle">PostgreSQL</text>
      <rect x="396" y="452" width="98" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="445" y="477" text-anchor="middle">Gemini</text>
    </g>
  </g>

  <!-- right: WhatsApp chat -->
  <g transform="translate(700 70)" filter="url(#shadow)">
    <rect width="300" height="500" rx="28" fill="#0B141A"/>
    <rect x="10" y="10" width="280" height="480" rx="20" fill="#ECE5DD"/>
    <!-- header -->
    <path d="M10 30 a20 20 0 0 1 20 -20 h240 a20 20 0 0 1 20 20 v38 h-280 z" fill="#075E54"/>
    <circle cx="40" cy="44" r="15" fill="#25D366"/>
    <text x="40" y="50" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">K</text>
    <text x="64" y="41" fill="#FFFFFF" font-size="15" font-weight="700">KhataBol</text>
    <text x="64" y="58" fill="#FFFFFF" fill-opacity="0.75" font-size="11">online</text>

    <g font-size="13" fill="#111B21">
      <!-- trader -->
      <rect x="62" y="86" width="216" height="74" rx="10" fill="#DCF8C6"/>
      <text x="74" y="108">Rashid se 500 kg kapra 120</text>
      <text x="74" y="126">ke rate pe liya, 20 hazar</text>
      <text x="74" y="144">cash diye</text>

      <!-- bot read-back -->
      <rect x="22" y="174" width="232" height="128" rx="10" fill="#FFFFFF"/>
      <text x="34" y="197" font-weight="700">Khareed: Rashid</text>
      <text x="34" y="216">500 kg @ 120 = Rs 60,000</text>
      <text x="34" y="242" font-weight="700">Paise diye: Rashid</text>
      <text x="34" y="261">Cash · Rs 20,000</text>
      <text x="34" y="287" fill="#54656F">Sahi hai to Haan karein.</text>

      <!-- trader yes -->
      <rect x="198" y="316" width="80" height="36" rx="10" fill="#DCF8C6"/>
      <text x="238" y="339" text-anchor="middle" font-weight="700">Haan</text>

      <!-- saved -->
      <rect x="22" y="366" width="150" height="36" rx="10" fill="#FFFFFF"/>
      <circle cx="42" cy="384" r="9" fill="#25D366"/>
      <path d="M37.5 384 l3.2 3.2 l6 -6.2" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="389">Save ho gaya.</text>
    </g>

    <!-- mic bar -->
    <rect x="22" y="430" width="210" height="40" rx="20" fill="#FFFFFF"/>
    <text x="40" y="455" fill="#8696A0" font-size="13">Message</text>
    <circle cx="256" cy="450" r="20" fill="#00A884"/>
    <rect x="251.5" y="438" width="9" height="15" rx="4.5" fill="#FFFFFF"/>
    <path d="M247 449 a9 9 0 0 0 18 0 M256 458 v5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- arrow -->
  <g stroke="#8BE7C1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M1010 300 C 1030 300, 1036 300, 1046 300" stroke-dasharray="2 8"/>
    <path d="M1040 292 l9 8 l-9 8"/>
  </g>

  <!-- app khata card -->
  <g transform="translate(1056 214)" filter="url(#shadow)">
    <rect width="190" height="186" rx="18" fill="#FFFFFF"/>
    <text x="18" y="34" fill="#5E6577" font-size="12" font-weight="700" letter-spacing="1">KHATA</text>
    <circle cx="34" cy="68" r="16" fill="#E8EBF8"/>
    <text x="34" y="74" text-anchor="middle" fill="#243282" font-size="15" font-weight="800">R</text>
    <text x="58" y="66" fill="#161925" font-size="16" font-weight="700">Rashid</text>
    <text x="58" y="84" fill="#5E6577" font-size="11">Supplier</text>
    <line x1="18" y1="104" x2="172" y2="104" stroke="#E2E5EC"/>
    <rect x="18" y="116" width="154" height="54" rx="10" fill="#FBE8E6"/>
    <text x="30" y="137" fill="#B42318" font-size="12" font-weight="600">Dena hai</text>
    <text x="30" y="160" fill="#B42318" font-size="20" font-weight="800">Rs 40,000</text>
    <circle cx="166" cy="26" r="5" fill="#25D366"/>
    <text x="156" y="30" text-anchor="end" fill="#0B7A53" font-size="10" font-weight="700">LIVE</text>
  </g>
</svg>
